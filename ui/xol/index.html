      { s: { ok: "ok", flag: "todo", stop: "bad", none: "todo", running: "todo" }[b.overall], t: { ok: "Last run: all checks OK", flag: "Last run: flags to review", stop: "Last run stopped on a STOP check", none: "No run for this book yet", running: "Run in progress" }[b.overall] },
    ];
    checklistCard.setBody(el("ul", { class: "checklist" }, items.map((i) => el("li", { class: i.s }, el("span", { class: "ic", "aria-label": i.s }, i.s === "ok" ? "✓" : i.s === "bad" ? "✕" : "○"), i.t))));
    checklistCard.setStatus(items.some((i) => i.s === "bad") ? "stop" : items.every((i) => i.s === "ok") ? "ok" : "info", items.some((i) => i.s === "bad") ? "Action needed" : items.every((i) => i.s === "ok") ? "Ready" : "To do");
    // run card
    const runningCode = runningStage(b, run);
    runLine.textContent = run ? `${run.title || run.action} ${JSON.stringify(run.args)} · ${run.running ? "running " + GC.fmtDur(run.started) : "finished " + GC.fmtWhen(run.finished) + " · exit code " + run.rc + " (" + GC.fmtDur(run.started, run.finished) + ")"} · log ${run.log}` : "no run from this page yet";
    runCard.setStatus(run && run.running ? "running" : b.overall);
    const codes = stageCodes();
    timeline.replaceChildren(...codes.map((code) => { const s = b.stages[code]; const stt = runningCode === code ? "running" : s.stale ? "stale" : s.status; return el("a", { class: "step " + stt, href: "#card-stage-" + code, title: stageDefs[code].title }, el("span", { class: "ic", "aria-hidden": "true" }, GC.STATUS[stt].ic), code); }));
    runLog.load();
    // cards
    renderControl(b); renderFiles(b); ensureStageCards();
    for (const code of codes) renderStage(code, b.stages[code], runningCode);
    renderResults(b);
    const key = JSON.stringify([run && run.started, run && run.finished]);
    if (lastRunKey && key !== lastRunKey && run && run.finished && !run.running) toast(run.rc === 0 ? "Run completed" : "Run stopped: see the stage cards");
    lastRunKey = key;
    sh.setNavStatus("run", runningCode ? "running" : b.overall);
    sh.setNavStatus("inputs", cards["card-control"] ? cards["card-control"].className.match(/\bs-(\w+)/)[1] : "none");
  }
  function hardRefresh() { controlKey = null; filesKey = null; for (const c of Object.values(stageCards)) c.dataset.key = ""; fillStageSel(); poller.tick(); }
  const poller = GC.poll(async () => { const st = await api("/api/state"); render(st); return st; }, POLL_MS);
  if (!offline) poller.start();
  else { bookInfo.replaceChildren(banner("flag", "Start " + M.launcher + " to see this tool folder's state.")); checklistCard.setBody(el("p", { class: "muted" }, "Needs the server.")); }
})();
</script>
